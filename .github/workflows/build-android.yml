name: Build Sudachi Switch Home Android
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout custom interface
        uses: actions/checkout@v4
      - name: Fetch upstream source and submodules
        run: |
          git clone --recurse-submodules https://github.com/Synoptikon/Sudachi.git upstream
          git -C upstream submodule update --init --recursive
      - name: Apply Switch Home interface
        run: |
          cp Sudachi-main/src/android/sudachi/src/main/res/layout/card_game.xml upstream/src/android/sudachi/src/main/res/layout/card_game.xml
          cp Sudachi-main/src/android/sudachi/src/main/res/layout/fragment_games.xml upstream/src/android/sudachi/src/main/res/layout/fragment_games.xml
          cp Sudachi-main/src/android/sudachi/src/main/java/org/sudachi/sudachi_emu/ui/GamesFragment.kt upstream/src/android/sudachi/src/main/java/org/sudachi/sudachi_emu/ui/GamesFragment.kt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK and NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;26.2.11394342' 'cmake;3.22.1'
      - name: Build debug APK
        working-directory: upstream/src/android
        run: |
          chmod +x gradlew
          ./gradlew :sudachi:assembleDebug --stacktrace
      - name: Upload APK or diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sudachi-switch-home-build-output
          path: |
            upstream/src/android/sudachi/build/outputs/apk/**/*.apk
            upstream/src/android/sudachi/build/reports/**
          if-no-files-found: warn
